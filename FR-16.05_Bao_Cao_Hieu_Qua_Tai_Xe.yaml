openapi: 3.0.3
info:
  title: CAB System - Báo cáo hiệu quả tài xế (FR-16.05)
  description: Đặc tả API cho yêu cầu chức năng FR-16.05 - Báo cáo hiệu quả tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /reports/driver-performance:
    get:
      tags:
        - Báo cáo hoạt động
      summary: FR-16.05 - Báo cáo hiệu quả tài xế

      parameters:
        - name: driverId
          in: query
          schema: { type: string, example: "DRV_001" }
      responses:
        '200':
          description: Cung cấp dữ liệu đánh giá hiệu quả hoạt động của tài xế
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripsCompleted: { type: integer, example: 120 }
                  rating: { type: number, example: 4.9 }
    