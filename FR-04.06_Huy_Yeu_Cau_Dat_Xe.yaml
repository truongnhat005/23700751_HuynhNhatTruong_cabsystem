openapi: 3.0.3
info:
  title: CAB System - Hủy yêu cầu đặt xe (FR-04.06)
  description: Đặc tả API cho yêu cầu chức năng FR-04.06 - Hủy yêu cầu đặt xe
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /trips/{tripId}/cancel:
    post:
      tags:
        - Đặt xe
      summary: FR-04.06 - Hủy yêu cầu đặt xe

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "Đổi kế hoạch đi lại" }
      responses:
        '200':
          description: Hủy yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId: { type: string, example: "TRIP_001" }
                  status: { type: string, example: "CANCELED" }
    