openapi: 3.0.3
info:
  title: CAB System - Báo cáo doanh thu (FR-16.02)
  description: Đặc tả API cho yêu cầu chức năng FR-16.02 - Báo cáo doanh thu
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /reports/revenue:
    get:
      tags:
        - Báo cáo hoạt động
      summary: FR-16.02 - Báo cáo doanh thu

      parameters:
        - name: fromDate
          in: query
          required: true
          schema: { type: string, example: "2026-09-01" }
        - name: toDate
          in: query
          required: true
          schema: { type: string, example: "2026-09-07" }
      responses:
        '200':
          description: Cung cấp báo cáo doanh thu theo khoảng thời gian
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRevenue: { type: number, example: 250000000 }
    