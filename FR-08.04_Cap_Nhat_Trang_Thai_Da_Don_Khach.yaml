openapi: 3.0.3
info:
  title: CAB System - Cập nhật trạng thái đã đón khách (FR-08.04)
  description: Đặc tả API cho yêu cầu chức năng FR-08.04 - Cập nhật trạng thái đã đón khách
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /trips/{tripId}/status/picked-up:
    patch:
      tags:
        - Quản lý trạng thái chuyến
      summary: FR-08.04 - Cập nhật trạng thái đã đón khách

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Tài xế cập nhật trạng thái sau khi đón khách
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "PICKED_UP" }
    