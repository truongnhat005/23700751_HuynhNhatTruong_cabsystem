openapi: 3.0.3
info:
  title: CAB System - Thanh toán tiền mặt (FR-10.02)
  description: Đặc tả API cho yêu cầu chức năng FR-10.02 - Thanh toán tiền mặt
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /payments/{tripId}/cash:
    post:
      tags:
        - Thanh toán
      summary: FR-10.02 - Thanh toán tiền mặt

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Hỗ trợ ghi nhận thanh toán bằng tiền mặt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã thu tiền mặt thành công" }
    