openapi: 3.0.3
info:
  title: CAB System - Xác định khoảng cách (FR-05.03)
  description: Đặc tả API cho yêu cầu chức năng FR-05.03 - Xác định khoảng cách
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /dispatch/calculate-distance:
    post:
      tags:
        - Tự động tìm tài xế
      summary: FR-05.03 - Xác định khoảng cách

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverLat, driverLng, pickupLat, pickupLng]
              properties:
                driverLat: { type: number, example: 10.776889 }
                driverLng: { type: number, example: 106.700806 }
                pickupLat: { type: number, example: 10.785000 }
                pickupLng: { type: number, example: 106.695000 }
      responses:
        '200':
          description: Khoảng cách giữa tài xế và điểm đón
          content:
            application/json:
              schema:
                type: object
                properties:
                  distanceKm: { type: number, example: 1.2 }
    