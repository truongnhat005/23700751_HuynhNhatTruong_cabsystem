openapi: 3.0.3
info:
  title: CAB System - Nhận kết quả thanh toán (FR-10.04)
  description: Đặc tả API cho yêu cầu chức năng FR-10.04 - Nhận kết quả thanh toán
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /payments/callback:
    post:
      tags:
        - Thanh toán
      summary: FR-10.04 - Nhận kết quả thanh toán

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, status]
              properties:
                transactionId: { type: string, example: "TXN_001" }
                status: { type: string, enum: [SUCCESS, FAILED], example: "SUCCESS" }
      responses:
        '200':
          description: Tiếp nhận và cập nhật kết quả giao dịch từ nhà cung cấp thanh toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã cập nhật kết quả thanh toán" }
    