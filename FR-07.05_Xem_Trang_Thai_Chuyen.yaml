openapi: 3.0.3
info:
  title: CAB System - Xem trạng thái chuyến (FR-07.05)
  description: Đặc tả API cho yêu cầu chức năng FR-07.05 - Xem trạng thái chuyến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /tracking/{tripId}/status:
    get:
      tags:
        - Theo dõi chuyến đi
      summary: FR-07.05 - Xem trạng thái chuyến

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Xem trạng thái hiện tại của chuyến đi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "IN_TRANSIT" }
    