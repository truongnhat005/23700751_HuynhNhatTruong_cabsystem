openapi: 3.0.3
info:
  title: CAB System - Chọn loại xe (FR-04.03)
  description: Đặc tả API cho yêu cầu chức năng FR-04.03 - Chọn loại xe
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /bookings/vehicle-type:
    post:
      tags:
        - Đặt xe
      summary: FR-04.03 - Chọn loại xe

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleType]
              properties:
                vehicleType: { type: string, enum: [4_SEATS, 7_SEATS, BIKE], example: "4_SEATS" }
      responses:
        '200':
          description: Ghi nhận loại xe thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicleType: { type: string, example: "4_SEATS" }
    