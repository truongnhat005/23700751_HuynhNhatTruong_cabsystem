openapi: 3.0.3
info:
  title: CAB System - Tính số tiền phải trả (FR-09.03)
  description: Đặc tả API cho yêu cầu chức năng FR-09.03 - Tính số tiền phải trả
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /fares/calculate:
    post:
      tags:
        - Tính cước
      summary: FR-09.03 - Tính số tiền phải trả

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceType, distanceKm]
              properties:
                serviceType: { type: string, example: "4_SEATS" }
                distanceKm: { type: number, example: 5.4 }
      responses:
        '200':
          description: Tính số tiền khách hàng cần thanh toán theo quy tắc tính cước
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount: { type: number, example: 65000 }
                  currency: { type: string, example: "VND" }
    