openapi: 3.0.3
info:
  title: CAB - BR-10 Thanh toán
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /payments/{tripId}/method:
    put:
      tags: [BR-10 – Thanh toán]
      summary: FR-10.01 - Chọn phương thức thanh toán
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod: { type: string, enum: [CASH, DIGITAL_WALLET, CREDIT_CARD] }
      responses:
        '200':
          description: Đã lưu phương thức thanh toán
  /payments/{tripId}/cash:
    post:
      tags: [BR-10 – Thanh toán]
      summary: FR-10.02 - Thanh toán tiền mặt
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ghi nhận thu tiền mặt hoàn tất
  /payments/{tripId}/online:
    post:
      tags: [BR-10 – Thanh toán]
      summary: FR-10.03 - Thanh toán trực tuyến
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Khởi tạo URL chuyển tiếp thanh toán điện tử
  /payments/gateway-callback:
    post:
      tags: [BR-10 – Thanh toán]
      summary: FR-10.04 - Nhận kết quả thanh toán
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gatewayTransactionId, resultCode]
              properties:
                gatewayTransactionId: { type: string }
                resultCode: { type: string }
      responses:
        '200':
          description: Tiếp nhận và xử lý kết quả từ nhà cung cấp thành công
  /payments/{tripId}/failure-handler:
    post:
      tags: [BR-10 – Thanh toán]
      summary: FR-10.05 - Xử lý thanh toán thất bại
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Kích hoạt quy trình xử lý lỗi và đổi phương thức
