openapi: 3.0.3
info:
  title: CAB System - Quản lý hồ sơ tài xế (FR-03.01)
  description: Đặc tả API cho yêu cầu chức năng FR-03.01 - Quản lý hồ sơ tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /drivers/{driverId}/profile:
    put:
      tags:
        - Quản lý tài xế
      summary: FR-03.01 - Quản lý hồ sơ tài xế

      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string, example: "DRV_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                licenseNumber: { type: string, example: "B2-998877" }
      responses:
        '200':
          description: Cập nhật hồ sơ tài xế thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Hồ sơ tài xế đã cập nhật" }
    