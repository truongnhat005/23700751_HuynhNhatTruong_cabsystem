openapi: 3.0.3
info:
  title: CAB System - Đăng ký tài khoản khách hàng (FR-01.01)
  description: Đặc tả API cho yêu cầu chức năng FR-01.01 - Đăng ký tài khoản khách hàng
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /auth/customers/register:
    post:
      tags:
        - Quản lý tài khoản
      summary: FR-01.01 - Đăng ký tài khoản khách hàng

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phoneNumber, password]
              properties:
                fullName: { type: string, example: "Nguyễn Văn A" }
                phoneNumber: { type: string, example: "0901234567" }
                email: { type: string, format: email, example: "a@gmail.com" }
                password: { type: string, format: password, example: "Password@123" }
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId: { type: string, example: "CUST_001" }
                  message: { type: string, example: "Đăng ký tài khoản thành công" }
        '400':
          description: Dữ liệu không hợp lệ
    
