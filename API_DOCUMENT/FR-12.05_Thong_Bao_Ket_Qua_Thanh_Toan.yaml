openapi: 3.0.3
info:
  title: CAB System - Thông báo kết quả thanh toán (FR-12.05)
  description: Đặc tả API cho yêu cầu chức năng FR-12.05 - Thông báo kết quả thanh toán
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /notifications/payment-result:
    post:
      tags:
        - Thông báo
      summary: FR-12.05 - Thông báo kết quả thanh toán

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, isSuccess]
              properties:
                customerId: { type: string, example: "CUST_001" }
                isSuccess: { type: boolean, example: true }
      responses:
        '200':
          description: Thông báo cho khách hàng về kết quả thanh toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã gửi thông báo kết quả thanh toán" }
    