openapi: 3.0.3
info:
  title: CAB System - Cập nhật trạng thái đã đến (FR-08.03)
  description: Đặc tả API cho yêu cầu chức năng FR-08.03 - Cập nhật trạng thái đã đến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /trips/{tripId}/status/arrived:
    patch:
      tags:
        - Quản lý trạng thái chuyến
      summary: FR-08.03 - Cập nhật trạng thái đã đến

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Tài xế cập nhật trạng thái khi đã đến điểm đón
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ARRIVED_AT_PICKUP" }
    