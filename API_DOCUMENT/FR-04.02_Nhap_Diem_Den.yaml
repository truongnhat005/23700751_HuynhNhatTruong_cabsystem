openapi: 3.0.3
info:
  title: CAB System - Nhập điểm đến (FR-04.02)
  description: Đặc tả API cho yêu cầu chức năng FR-04.02 - Nhập điểm đến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /bookings/dropoff-location:
    post:
      tags:
        - Đặt xe
      summary: FR-04.02 - Nhập điểm đến

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dropoffAddress, latitude, longitude]
              properties:
                dropoffAddress: { type: string, example: "Sân bay TSN" }
                latitude: { type: number, example: 10.818463 }
                longitude: { type: number, example: 106.658825 }
      responses:
        '200':
          description: Ghi nhận điểm đến thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Lưu điểm đến thành công" }
    