openapi: 3.0.3
info:
  title: CAB System - Cập nhật trạng thái đã nhận chuyến (FR-08.02)
  description: Đặc tả API cho yêu cầu chức năng FR-08.02 - Cập nhật trạng thái đã nhận chuyến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /trips/{tripId}/status/accepted:
    patch:
      tags:
        - Quản lý trạng thái chuyến
      summary: FR-08.02 - Cập nhật trạng thái đã nhận chuyến

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Cập nhật trạng thái khi tài xế chấp nhận chuyến
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ACCEPTED" }
    