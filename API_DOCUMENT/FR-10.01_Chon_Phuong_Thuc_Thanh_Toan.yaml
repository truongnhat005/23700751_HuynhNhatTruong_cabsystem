openapi: 3.0.3
info:
  title: CAB System - Chọn phương thức thanh toán (FR-10.01)
  description: Đặc tả API cho yêu cầu chức năng FR-10.01 - Chọn phương thức thanh toán
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /payments/{tripId}/method:
    put:
      tags:
        - Thanh toán
      summary: FR-10.01 - Chọn phương thức thanh toán

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [CASH, DIGITAL_WALLET, CREDIT_CARD], example: "CASH" }
      responses:
        '200':
          description: Cho phép khách hàng lựa chọn phương thức thanh toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  selectedMethod: { type: string, example: "CASH" }
    