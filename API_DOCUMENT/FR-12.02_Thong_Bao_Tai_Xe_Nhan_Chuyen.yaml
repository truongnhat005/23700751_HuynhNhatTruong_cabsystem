openapi: 3.0.3
info:
  title: CAB System - Thông báo tài xế nhận chuyến (FR-12.02)
  description: Đặc tả API cho yêu cầu chức năng FR-12.02 - Thông báo tài xế nhận chuyến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /notifications/driver-accepted:
    post:
      tags:
        - Thông báo
      summary: FR-12.02 - Thông báo tài xế nhận chuyến

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, driverId]
              properties:
                customerId: { type: string, example: "CUST_001" }
                driverId: { type: string, example: "DRV_001" }
      responses:
        '200':
          description: Thông báo cho khách hàng khi tài xế nhận chuyến
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã gửi thông báo tài xế nhận chuyến" }
    