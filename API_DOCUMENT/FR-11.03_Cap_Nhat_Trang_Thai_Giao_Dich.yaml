openapi: 3.0.3
info:
  title: CAB System - Cập nhật trạng thái giao dịch (FR-11.03)
  description: Đặc tả API cho yêu cầu chức năng FR-11.03 - Cập nhật trạng thái giao dịch
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /transactions/{transactionId}/status:
    patch:
      tags:
        - Quản lý giao dịch
      summary: FR-11.03 - Cập nhật trạng thái giao dịch

      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, example: "TXN_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PENDING, SUCCESS, FAILED], example: "SUCCESS" }
      responses:
        '200':
          description: Cập nhật trạng thái giao dịch theo kết quả thanh toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "SUCCESS" }
    