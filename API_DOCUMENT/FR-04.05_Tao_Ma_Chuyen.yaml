openapi: 3.0.3
info:
  title: CAB System - Tạo mã chuyến (FR-04.05)
  description: Đặc tả API cho yêu cầu chức năng FR-04.05 - Tạo mã chuyến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /trips/generate-code:
    post:
      tags:
        - Đặt xe
      summary: FR-04.05 - Tạo mã chuyến

      responses:
        '201':
          description: Tự động tạo mã chuyến thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripCode: { type: string, example: "CAB_TRIP_2026_001" }
    