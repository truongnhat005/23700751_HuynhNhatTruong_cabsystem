openapi: 3.0.3
info:
  title: CAB System - Nhập nhận xét (FR-13.03)
  description: Đặc tả API cho yêu cầu chức năng FR-13.03 - Nhập nhận xét
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /reviews/{tripId}/comment:
    post:
      tags:
        - Đánh giá tài xế
      summary: FR-13.03 - Nhập nhận xét

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, example: "Tài xế lái xe cẩn thận" }
      responses:
        '200':
          description: Cho phép khách hàng nhập nhận xét về chuyến đi hoặc tài xế
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã lưu nhận xét" }
    