openapi: 3.0.3
info:
  title: CAB System - Xem thông tin tài xế (FR-07.01)
  description: Đặc tả API cho yêu cầu chức năng FR-07.01 - Xem thông tin tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /tracking/{tripId}/driver:
    get:
      tags:
        - Theo dõi chuyến đi
      summary: FR-07.01 - Xem thông tin tài xế

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Xem thông tin tài xế đã nhận chuyến
          content:
            application/json:
              schema:
                type: object
                properties:
                  fullName: { type: string, example: "Trần Văn B" }
                  phoneNumber: { type: string, example: "0988776655" }
    