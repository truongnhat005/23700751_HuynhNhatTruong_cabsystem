openapi: 3.0.3
info:
  title: CAB - BR-14 Quản lý vận hành
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /operations/customers:
    get:
      tags: [BR-14 – Quản lý vận hành]
      summary: FR-14.01 - Quản lý khách hàng
      responses:
        '200':
          description: Danh sách và trạng thái khách hàng cho ban vận hành
  /operations/drivers:
    get:
      tags: [BR-14 – Quản lý vận hành]
      summary: FR-14.02 - Quản lý tài xế
      responses:
        '200':
          description: Quản lý hồ sơ và trạng thái tài xế
  /operations/vehicles:
    get:
      tags: [BR-14 – Quản lý vận hành]
      summary: FR-14.03 - Quản lý phương tiện
      responses:
        '200':
          description: Danh mục xe và tình trạng đăng kiểm/sử dụng
  /operations/trips/active:
    get:
      tags: [BR-14 – Quản lý vận hành]
      summary: FR-14.04 - Theo dõi chuyến đang diễn ra
      responses:
        '200':
          description: Giám sát thời gian thực các chuyến đang di chuyển
  /operations/drivers/status-check:
    get:
      tags: [BR-14 – Quản lý vận hành]
      summary: FR-14.05 - Kiểm tra trạng thái tài xế
      responses:
        '200':
          description: Kiểm tra tài xế rảnh, bận, offline trên toàn hệ thống
  /operations/trips/{tripId}/resolve-error:
    post:
      tags: [BR-14 – Quản lý vận hành]
      summary: FR-14.06 - Xử lý chuyến lỗi
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [solution]
              properties:
                solution: { type: string }
      responses:
        '200':
          description: Đã can thiệp xử lý sự cố chuyến xe
  /operations/trips/history:
    get:
      tags: [BR-14 – Quản lý vận hành]
      summary: FR-14.07 - Tra cứu lịch sử chuyến
      responses:
        '200':
          description: Dữ liệu lịch sử các chuyến xe đã diễn ra
