openapi: 3.0.3
info:
  title: CAB - BR-07 Theo dõi chuyến đi
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /tracking/{tripId}/driver:
    get:
      tags: [BR-07 – Theo dõi chuyến đi]
      summary: FR-07.01 - Xem thông tin tài xế
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tên, số điện thoại, đánh giá của tài xế
  /tracking/{tripId}/vehicle:
    get:
      tags: [BR-07 – Theo dõi chuyến đi]
      summary: FR-07.02 - Xem thông tin phương tiện
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Biển số xe, mẫu xe, màu xe
  /tracking/{tripId}/location:
    get:
      tags: [BR-07 – Theo dõi chuyến đi]
      summary: FR-07.03 - Theo dõi vị trí tài xế
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Tọa độ GPS hiện tại của xe
  /tracking/{tripId}/eta:
    get:
      tags: [BR-07 – Theo dõi chuyến đi]
      summary: FR-07.04 - Xem thời gian dự kiến
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Số phút ước tính tài xế đến nơi
  /tracking/{tripId}/current-status:
    get:
      tags: [BR-07 – Theo dõi chuyến đi]
      summary: FR-07.05 - Xem trạng thái chuyến
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Trạng thái hiện tại của chuyến đi
