openapi: 3.0.3
info:
  title: CAB - BR-16 Báo cáo hoạt động
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /reports/trips/count:
    get:
      tags: [BR-16 – Báo cáo hoạt động]
      summary: FR-16.01 - Báo cáo số lượng chuyến
      parameters:
        - name: fromDate
          in: query
          required: true
          schema: { type: string }
        - name: toDate
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Thống kê số lượng chuyến theo mốc thời gian
  /reports/revenue:
    get:
      tags: [BR-16 – Báo cáo hoạt động]
      summary: FR-16.02 - Báo cáo doanh thu
      parameters:
        - name: fromDate
          in: query
          required: true
          schema: { type: string }
        - name: toDate
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Báo cáo doanh thu theo mốc thời gian
  /reports/trips/completion-rate:
    get:
      tags: [BR-16 – Báo cáo hoạt động]
      summary: FR-16.03 - Báo cáo tỷ lệ hoàn thành
      responses:
        '200':
          description: Tỷ lệ chuyến xe hoàn thành (%)
  /reports/trips/cancellation-rate:
    get:
      tags: [BR-16 – Báo cáo hoạt động]
      summary: FR-16.04 - Báo cáo tỷ lệ hủy
      responses:
        '200':
          description: Tỷ lệ chuyến xe bị hủy (%)
  /reports/drivers/performance:
    get:
      tags: [BR-16 – Báo cáo hoạt động]
      summary: FR-16.05 - Báo cáo hiệu quả tài xế
      parameters:
        - name: driverId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Chỉ số đánh giá năng suất và chất lượng tài xế
