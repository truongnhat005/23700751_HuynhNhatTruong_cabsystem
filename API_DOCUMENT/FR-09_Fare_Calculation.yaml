openapi: 3.0.3
info:
  title: CAB - BR-09 Tính cước
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /fares/determine-service:
    post:
      tags: [BR-09 – Tính cước]
      summary: FR-09.01 - Xác định loại dịch vụ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceType]
              properties:
                serviceType: { type: string }
      responses:
        '200':
          description: Bảng giá dịch vụ áp dụng
  /fares/trip-info:
    post:
      tags: [BR-09 – Tính cước]
      summary: FR-09.02 - Thu thập thông tin chuyến
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [distanceKm, durationMinutes]
              properties:
                distanceKm: { type: number }
                durationMinutes: { type: integer }
      responses:
        '200':
          description: Ghi nhận thông số lộ trình thành công
  /fares/calculate-amount:
    post:
      tags: [BR-09 – Tính cước]
      summary: FR-09.03 - Tính số tiền phải trả
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceType, distanceKm]
              properties:
                serviceType: { type: string }
                distanceKm: { type: number }
      responses:
        '200':
          description: Số tiền cước đã tính toán theo công thức
  /fares/{tripId}/display:
    get:
      tags: [BR-09 – Tính cước]
      summary: FR-09.04 - Hiển thị số tiền
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Số tiền cước hiển thị cho khách hàng
