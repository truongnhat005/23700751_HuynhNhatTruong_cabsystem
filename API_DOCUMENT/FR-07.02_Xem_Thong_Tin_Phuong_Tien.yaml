openapi: 3.0.3
info:
  title: CAB System - Xem thông tin phương tiện (FR-07.02)
  description: Đặc tả API cho yêu cầu chức năng FR-07.02 - Xem thông tin phương tiện
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /tracking/{tripId}/vehicle:
    get:
      tags:
        - Theo dõi chuyến đi
      summary: FR-07.02 - Xem thông tin phương tiện

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Xem thông tin phương tiện của tài xế
          content:
            application/json:
              schema:
                type: object
                properties:
                  licensePlate: { type: string, example: "51F-123.45" }
                  vehicleType: { type: string, example: "4_SEATS" }
    