openapi: 3.0.3
info:
  title: CAB System - Cập nhật thông tin khách hàng (FR-02.03)
  description: Đặc tả API cho yêu cầu chức năng FR-02.03 - Cập nhật thông tin khách hàng
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /customers/{customerId}:
    put:
      tags:
        - Quản lý khách hàng
      summary: FR-02.03 - Cập nhật thông tin khách hàng

      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, example: "CUST_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, example: "Nguyễn Văn A" }
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Cập nhật thông tin khách hàng thành công" }
    