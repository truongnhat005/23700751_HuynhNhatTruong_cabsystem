openapi: 3.0.3
info:
  title: CAB System - Cập nhật trạng thái đang di chuyển (FR-08.05)
  description: Đặc tả API cho yêu cầu chức năng FR-08.05 - Cập nhật trạng thái đang di chuyển
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /trips/{tripId}/status/in-transit:
    patch:
      tags:
        - Quản lý trạng thái chuyến
      summary: FR-08.05 - Cập nhật trạng thái đang di chuyển

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Tài xế cập nhật trạng thái khi chuyến đang được thực hiện
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "IN_TRANSIT" }
    