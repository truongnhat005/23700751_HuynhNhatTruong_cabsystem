openapi: 3.0.3
info:
  title: CAB - BR-05 Tự động tìm tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /dispatch/available-drivers:
    get:
      tags: [BR-05 – Tự động tìm tài xế]
      summary: FR-05.01 - Xác định tài xế sẵn sàng
      responses:
        '200':
          description: Danh sách tài xế đang sẵn sàng
  /dispatch/filter-drivers:
    post:
      tags: [BR-05 – Tự động tìm tài xế]
      summary: FR-05.02 - Lọc tài xế phù hợp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleType]
              properties:
                vehicleType: { type: string }
      responses:
        '200':
          description: Danh sách tài xế thỏa tiêu chí
  /dispatch/calculate-distance:
    post:
      tags: [BR-05 – Tự động tìm tài xế]
      summary: FR-05.03 - Xác định khoảng cách
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverLat, driverLng, pickupLat, pickupLng]
              properties:
                driverLat: { type: number }
                driverLng: { type: number }
                pickupLat: { type: number }
                pickupLng: { type: number }
      responses:
        '200':
          description: Khoảng cách giữa tài xế và khách hàng
  /dispatch/rank-drivers:
    post:
      tags: [BR-05 – Tự động tìm tài xế]
      summary: FR-05.04 - Ưu tiên tài xế gần
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverList]
              properties:
                driverList: { type: array, items: { type: string } }
      responses:
        '200':
          description: Thứ tự tài xế được sắp xếp ưu tiên theo khoảng cách
  /dispatch/send-request:
    post:
      tags: [BR-05 – Tự động tìm tài xế]
      summary: FR-05.05 - Gửi yêu cầu chuyến
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, targetDriverId]
              properties:
                tripId: { type: string }
                targetDriverId: { type: string }
      responses:
        '200':
          description: Lệnh nhận chuyến đã phát tới tài xế
  /dispatch/retry-next-driver:
    post:
      tags: [BR-05 – Tự động tìm tài xế]
      summary: FR-05.06 - Tìm tài xế tiếp theo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, previousDriverId]
              properties:
                tripId: { type: string }
                previousDriverId: { type: string }
      responses:
        '200':
          description: Chuyển yêu cầu sang tài xế kế tiếp
  /dispatch/driver-not-found:
    post:
      tags: [BR-05 – Tự động tìm tài xế]
      summary: FR-05.07 - Thông báo không tìm được tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, customerId]
              properties:
                tripId: { type: string }
                customerId: { type: string }
      responses:
        '200':
          description: Thông báo đã gửi tới khách hàng
