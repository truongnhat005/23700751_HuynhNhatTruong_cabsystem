openapi: 3.0.3
info:
  title: CAB System - Thông báo tiếp nhận đặt xe (FR-12.01)
  description: Đặc tả API cho yêu cầu chức năng FR-12.01 - Thông báo tiếp nhận đặt xe
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /notifications/booking-received:
    post:
      tags:
        - Thông báo
      summary: FR-12.01 - Thông báo tiếp nhận đặt xe

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, tripId]
              properties:
                customerId: { type: string, example: "CUST_001" }
                tripId: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Thông báo cho khách hàng khi yêu cầu đặt xe được tiếp nhận
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã gửi thông báo tiếp nhận đặt xe" }
    