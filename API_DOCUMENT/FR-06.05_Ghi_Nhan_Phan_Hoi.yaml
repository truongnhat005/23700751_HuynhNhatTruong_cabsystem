openapi: 3.0.3
info:
  title: CAB System - Ghi nhận phản hồi (FR-06.05)
  description: Đặc tả API cho yêu cầu chức năng FR-06.05 - Ghi nhận phản hồi
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /driver/trips/{tripId}/response-log:
    post:
      tags:
        - Xử lý nhận chuyến
      summary: FR-06.05 - Ghi nhận phản hồi

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, responseDurationSec]
              properties:
                action: { type: string, enum: [ACCEPT, REJECT, TIMEOUT] }
                responseDurationSec: { type: integer, example: 4 }
      responses:
        '201':
          description: Ghi nhận kết quả và thời gian phản hồi của tài xế
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã ghi nhận phản hồi" }
    