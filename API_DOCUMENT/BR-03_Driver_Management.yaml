openapi: 3.0.3
info:
  title: CAB - BR-03 Quản lý tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /drivers/{driverId}/profile:
    put:
      tags: [BR-03 – Quản lý tài xế]
      summary: FR-03.01 - Quản lý hồ sơ tài xế
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                driverLicense: { type: string }
      responses:
        '200':
          description: Cập nhật thành công
  /drivers/{driverId}/vehicle:
    put:
      tags: [BR-03 – Quản lý tài xế]
      summary: FR-03.02 - Quản lý phương tiện
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licensePlate, vehicleType]
              properties:
                licensePlate: { type: string }
                vehicleType: { type: string }
      responses:
        '200':
          description: Cập nhật thông tin phương tiện thành công
  /drivers/{driverId}/availability:
    patch:
      tags: [BR-03 – Quản lý tài xế]
      summary: FR-03.03 - Cập nhật trạng thái hoạt động
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isReady]
              properties:
                isReady: { type: boolean }
      responses:
        '200':
          description: Trạng thái trực tuyến đã cập nhật
  /drivers/{driverId}/location:
    put:
      tags: [BR-03 – Quản lý tài xế]
      summary: FR-03.04 - Cập nhật vị trí tài xế
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number }
                longitude: { type: number }
      responses:
        '200':
          description: Vị trí GPS đã lưu
  /drivers/{driverId}:
    get:
      tags: [BR-03 – Quản lý tài xế]
      summary: FR-03.05 - Xem thông tin tài xế
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Chi tiết hồ sơ và trạng thái tài xế
