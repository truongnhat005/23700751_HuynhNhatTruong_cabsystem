openapi: 3.0.3
info:
  title: CAB System - Ưu tiên tài xế gần (FR-05.04)
  description: Đặc tả API cho yêu cầu chức năng FR-05.04 - Ưu tiên tài xế gần
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /dispatch/rank-nearby-drivers:
    post:
      tags:
        - Tự động tìm tài xế
      summary: FR-05.04 - Ưu tiên tài xế gần

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverIds]
              properties:
                driverIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: Danh sách tài xế sắp xếp theo thứ tự ưu tiên khoảng cách
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
    