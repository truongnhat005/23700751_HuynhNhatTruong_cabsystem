openapi: 3.0.3
info:
  title: CAB System - Lưu mã giao dịch (FR-11.02)
  description: Đặc tả API cho yêu cầu chức năng FR-11.02 - Lưu mã giao dịch
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /transactions/{transactionId}/save-code:
    put:
      tags:
        - Quản lý giao dịch
      summary: FR-11.02 - Lưu mã giao dịch

      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, example: "TXN_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reconciliationCode]
              properties:
                reconciliationCode: { type: string, example: "REF_9988" }
      responses:
        '200':
          description: Lưu mã giao dịch để phục vụ tra cứu và đối soát
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Mã giao dịch đã được lưu" }
    