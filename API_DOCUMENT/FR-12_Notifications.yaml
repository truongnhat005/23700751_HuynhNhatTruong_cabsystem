openapi: 3.0.3
info:
  title: CAB - BR-12 Thông báo
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /notifications/push/booking-received:
    post:
      tags: [BR-12 – Thông báo]
      summary: FR-12.01 - Thông báo tiếp nhận đặt xe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, tripId]
              properties:
                customerId: { type: string }
                tripId: { type: string }
      responses:
        '200':
          description: Đã gửi thông báo tiếp nhận đặt xe
  /notifications/push/driver-accepted:
    post:
      tags: [BR-12 – Thông báo]
      summary: FR-12.02 - Thông báo tài xế nhận chuyến
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, driverId]
              properties:
                customerId: { type: string }
                driverId: { type: string }
      responses:
        '200':
          description: Đã gửi thông báo tài xế nhận chuyến
  /notifications/push/driver-arrived:
    post:
      tags: [BR-12 – Thông báo]
      summary: FR-12.03 - Thông báo tài xế đến
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string }
      responses:
        '200':
          description: Đã gửi thông báo tài xế đã đến điểm đón
  /notifications/push/trip-completed:
    post:
      tags: [BR-12 – Thông báo]
      summary: FR-12.04 - Thông báo hoàn thành chuyến
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, tripId]
              properties:
                customerId: { type: string }
                tripId: { type: string }
      responses:
        '200':
          description: Đã gửi thông báo hoàn thành chuyến
  /notifications/push/payment-result:
    post:
      tags: [BR-12 – Thông báo]
      summary: FR-12.05 - Thông báo kết quả thanh toán
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, isSuccess]
              properties:
                customerId: { type: string }
                isSuccess: { type: boolean }
      responses:
        '200':
          description: Đã gửi thông báo kết quả thanh toán
  /notifications/push/driver-new-request:
    post:
      tags: [BR-12 – Thông báo]
      summary: FR-12.06 - Thông báo chuyến mới cho tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId, tripId]
              properties:
                driverId: { type: string }
                tripId: { type: string }
      responses:
        '200':
          description: Đã bắn thông báo chuyến mới tới tài xế
