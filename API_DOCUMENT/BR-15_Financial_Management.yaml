openapi: 3.0.3
info:
  title: CAB - BR-15 Quản lý tài chính
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /finance/transactions:
    get:
      tags: [BR-15 – Quản lý tài chính]
      summary: FR-15.01 - Tra cứu giao dịch
      responses:
        '200':
          description: Danh sách các giao dịch phát sinh
  /finance/revenue:
    get:
      tags: [BR-15 – Quản lý tài chính]
      summary: FR-15.02 - Theo dõi doanh thu
      parameters:
        - name: fromDate
          in: query
          required: true
          schema: { type: string }
        - name: toDate
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Số liệu doanh thu từ các chuyến đi và thanh toán
  /finance/payments/status-check:
    get:
      tags: [BR-15 – Quản lý tài chính]
      summary: FR-15.03 - Kiểm tra trạng thái thanh toán
      parameters:
        - name: transactionId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Trạng thái chi tiết thanh toán
  /finance/transactions/failed:
    get:
      tags: [BR-15 – Quản lý tài chính]
      summary: FR-15.04 - Xem giao dịch thất bại
      responses:
        '200':
          description: Báo cáo đối soát các thanh toán bị lỗi
