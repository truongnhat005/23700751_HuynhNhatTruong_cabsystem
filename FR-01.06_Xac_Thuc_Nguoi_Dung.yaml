openapi: 3.0.3
info:
  title: CAB System - Xác thực người dùng (FR-01.06)
  description: Đặc tả API cho yêu cầu chức năng FR-01.06 - Xác thực người dùng
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /auth/verify-token:
    post:
      tags:
        - Quản lý tài khoản
      summary: FR-01.06 - Xác thực người dùng

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, example: "jwt_token_sample" }
      responses:
        '200':
          description: Token hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
    