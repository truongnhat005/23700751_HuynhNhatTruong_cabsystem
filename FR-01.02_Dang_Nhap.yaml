openapi: 3.0.3
info:
  title: CAB System - Đăng nhập (FR-01.02)
  description: Đặc tả API cho yêu cầu chức năng FR-01.02 - Đăng nhập
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /auth/login:
    post:
      tags:
        - Quản lý tài khoản
      summary: FR-01.02 - Đăng nhập

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "0901234567" }
                password: { type: string, format: password, example: "Password@123" }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string, example: "jwt_token_sample" }
                  tokenType: { type: string, example: "Bearer" }
                  role: { type: string, example: "CUSTOMER" }
        '401':
          description: Sai thông tin đăng nhập
    