openapi: 3.0.3
info:
  title: CAB System - Quản lý trạng thái tài khoản (FR-02.04)
  description: Đặc tả API cho yêu cầu chức năng FR-02.04 - Quản lý trạng thái tài khoản
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /customers/{customerId}/status:
    patch:
      tags:
        - Quản lý khách hàng
      summary: FR-02.04 - Quản lý trạng thái tài khoản

      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, example: "CUST_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, LOCKED, SUSPENDED], example: "LOCKED" }
      responses:
        '200':
          description: Cập nhật trạng thái tài khoản thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã cập nhật trạng thái tài khoản" }
    