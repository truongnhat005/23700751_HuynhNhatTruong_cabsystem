openapi: 3.0.3
info:
  title: CAB System - Cập nhật trạng thái tìm tài xế (FR-08.01)
  description: Đặc tả API cho yêu cầu chức năng FR-08.01 - Cập nhật trạng thái tìm tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /trips/{tripId}/status/searching:
    patch:
      tags:
        - Quản lý trạng thái chuyến
      summary: FR-08.01 - Cập nhật trạng thái tìm tài xế

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Ghi nhận trạng thái chuyến khi đang tìm tài xế
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "SEARCHING_DRIVER" }
    