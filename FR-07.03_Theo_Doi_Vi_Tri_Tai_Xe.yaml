openapi: 3.0.3
info:
  title: CAB System - Theo dõi vị trí tài xế (FR-07.03)
  description: Đặc tả API cho yêu cầu chức năng FR-07.03 - Theo dõi vị trí tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /tracking/{tripId}/location:
    get:
      tags:
        - Theo dõi chuyến đi
      summary: FR-07.03 - Theo dõi vị trí tài xế

      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, example: "TRIP_001" }
      responses:
        '200':
          description: Theo dõi vị trí hiện tại của tài xế
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitude: { type: number, example: 10.776889 }
                  longitude: { type: number, example: 106.700806 }
    