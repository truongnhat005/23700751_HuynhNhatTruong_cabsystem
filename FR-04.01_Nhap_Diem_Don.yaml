openapi: 3.0.3
info:
  title: CAB System - Nhập điểm đón (FR-04.01)
  description: Đặc tả API cho yêu cầu chức năng FR-04.01 - Nhập điểm đón
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /bookings/pickup-location:
    post:
      tags:
        - Đặt xe
      summary: FR-04.01 - Nhập điểm đón

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupAddress, latitude, longitude]
              properties:
                pickupAddress: { type: string, example: "123 Lê Lợi, Q1" }
                latitude: { type: number, example: 10.776889 }
                longitude: { type: number, example: 106.700806 }
      responses:
        '200':
          description: Ghi nhận vị trí đón thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Lưu điểm đón thành công" }
    