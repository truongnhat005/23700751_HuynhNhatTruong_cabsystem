openapi: 3.0.3
info:
  title: CAB System - Quản lý phương tiện (FR-03.02)
  description: Đặc tả API cho yêu cầu chức năng FR-03.02 - Quản lý phương tiện
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /drivers/{driverId}/vehicle:
    put:
      tags:
        - Quản lý tài xế
      summary: FR-03.02 - Quản lý phương tiện

      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string, example: "DRV_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licensePlate, vehicleType]
              properties:
                licensePlate: { type: string, example: "51F-123.45" }
                vehicleType: { type: string, example: "4_SEATS" }
      responses:
        '200':
          description: Cập nhật phương tiện thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Cập nhật phương tiện thành công" }
    