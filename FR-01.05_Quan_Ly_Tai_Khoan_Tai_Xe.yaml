openapi: 3.0.3
info:
  title: CAB System - Quản lý tài khoản tài xế (FR-01.05)
  description: Đặc tả API cho yêu cầu chức năng FR-01.05 - Quản lý tài khoản tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /operators/driver-accounts:
    post:
      tags:
        - Quản lý tài khoản
      summary: FR-01.05 - Quản lý tài khoản tài xế

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phoneNumber, licenseNumber]
              properties:
                fullName: { type: string, example: "Trần Văn B" }
                phoneNumber: { type: string, example: "0988776655" }
                licenseNumber: { type: string, example: "B2-998877" }
      responses:
        '201':
          description: Tạo hoặc cập nhật tài khoản tài xế thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  driverId: { type: string, example: "DRV_001" }
                  message: { type: string, example: "Tạo tài khoản tài xế thành công" }
    