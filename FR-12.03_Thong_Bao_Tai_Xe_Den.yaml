openapi: 3.0.3
info:
  title: CAB System - Thông báo tài xế đến (FR-12.03)
  description: Đặc tả API cho yêu cầu chức năng FR-12.03 - Thông báo tài xế đến
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /notifications/driver-arrived:
    post:
      tags:
        - Thông báo
      summary: FR-12.03 - Thông báo tài xế đến

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId: { type: string, example: "CUST_001" }
      responses:
        '200':
          description: Thông báo cho khách hàng khi tài xế đến điểm đón
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Đã gửi thông báo tài xế đã đến" }
    