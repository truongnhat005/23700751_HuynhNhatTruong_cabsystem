openapi: 3.0.3
info:
  title: CAB System - Xem thông tin tài xế (FR-03.05)
  description: Đặc tả API cho yêu cầu chức năng FR-03.05 - Xem thông tin tài xế
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /drivers/{driverId}:
    get:
      tags:
        - Quản lý tài xế
      summary: FR-03.05 - Xem thông tin tài xế

      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string, example: "DRV_001" }
      responses:
        '200':
          description: Chi tiết tài xế và trạng thái hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  driverId: { type: string, example: "DRV_001" }
                  fullName: { type: string, example: "Trần Văn B" }
                  isAvailable: { type: boolean, example: true }
    