openapi: 3.0.3
info:
  title: CAB System - Cập nhật trạng thái hoạt động (FR-03.03)
  description: Đặc tả API cho yêu cầu chức năng FR-03.03 - Cập nhật trạng thái hoạt động
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /drivers/{driverId}/availability:
    patch:
      tags:
        - Quản lý tài xế
      summary: FR-03.03 - Cập nhật trạng thái hoạt động

      parameters:
        - name: driverId
          in: path
          required: true
          schema: { type: string, example: "DRV_001" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isReady]
              properties:
                isReady: { type: boolean, example: true }
      responses:
        '200':
          description: Đã chuyển đổi trạng thái sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Trạng thái sẵn sàng đã cập nhật" }
    