openapi: 3.0.3
info:
  title: CAB System - Cập nhật thông tin cá nhân (FR-01.04)
  description: Đặc tả API cho yêu cầu chức năng FR-01.04 - Cập nhật thông tin cá nhân
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1

paths:
  /users/profile:
    put:
      tags:
        - Quản lý tài khoản
      summary: FR-01.04 - Cập nhật thông tin cá nhân

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, example: "Nguyễn Văn A" }
                email: { type: string, example: "a_new@gmail.com" }
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Cập nhật thành công" }
    